name: Tests

# PR-only and personal push testing.
on:
  pull_request:
  push:
    branches: [personal]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          for f in $(find . -name "*.sh" -o -name "PKGBUILD"); do
            bash -n "$f"
          done
